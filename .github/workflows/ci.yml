name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Resumir contratos alterados
        id: decisions
        run: |
          node scripts/pr-decisions-diff.mjs "origin/${{ github.base_ref }}" "${{ github.sha }}" > /tmp/summary.md
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/summary.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comentar resumo no PR
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.decisions.outputs.summary }}`.trim();
            if (!summary) return;
            const marker = "<!-- lvxfr-contract-summary -->";
            const body = `${marker}\n${summary}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
